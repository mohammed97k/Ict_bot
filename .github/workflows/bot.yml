name: ICT Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Setup MT5
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile mt5.exe
          Write-Host "Downloaded. Installing..."
          Start-Process .\mt5.exe -ArgumentList "/auto" -Wait
          Start-Sleep 30
          $mt5exe = "C:\Program Files\MetaTrader 5\terminal64.exe"
          if (Test-Path $mt5exe) {
            Write-Host "MT5 found. Launching..."
            Start-Process $mt5exe
            Start-Sleep 20
            Write-Host "MT5 running."
          } else {
            Write-Host "MT5 not found at expected path."
            Get-ChildItem "C:\Program Files" -Directory | Select-Object Name
            Get-ChildItem "$env:APPDATA\MetaQuotes\Terminal" -Directory -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }
      - name: Run
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_SYMBOL: ${{ secrets.MT5_SYMBOL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ict_bot.py
      - name: Save state
        shell: pwsh
        run: |
          git config user.name bot
          git config user.email bot@local
          git add config.json
          git diff --staged --quiet; if ($LASTEXITCODE -ne 0) { git commit -m "s [skip ci]"; git push }