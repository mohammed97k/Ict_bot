name: ICT Trading Bot — Every 5 Min

on:
  schedule:
    # كل 5 دقائق خلال ساعات السوق الأمريكية
    # UTC: 13:30-21:00 = EST: 08:30-16:00
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: data/state.json
          key: ict-state-${{ github.run_id }}
          restore-keys: |
            ict-state-

      - name: Run bot once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TWELVEDATA_TICKER:  ${{ secrets.TWELVEDATA_TICKER }}
          KIT_API_KEY:        ${{ secrets.KIT_API_KEY }}
          KIT_API_SECRET:     ${{ secrets.KIT_API_SECRET }}
          KIT_BASE_URL:       ${{ secrets.KIT_BASE_URL }}
          KIT_SYMBOL:         ${{ secrets.KIT_SYMBOL }}
        run: python main.py --once
